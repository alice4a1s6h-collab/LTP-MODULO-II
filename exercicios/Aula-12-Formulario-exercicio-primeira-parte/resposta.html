<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Carros Eletricos</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        
            <label for="iusu">Nome Completo </label><br>
            <!-- 
            required - obrigatório; 
            minlength - Tamanho mínimo; 
            maxlength - Tamanho máximo;
            size - Tamanho da caixa;
            placeholder - dica de preenchimento;
            autocomplete off - Não completar o preenchimento;           
            -->
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="20" 
            placeholder="Nome do usuário" autocomplete="username">
            <!-- autocomplete de username -->
        </p>
        
            <label for="isen">Modelo de carro eletrico favorito </label><br>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="15" placeholder="Ex: Tesla model 3" autocomplete="current-password">
            <!-- current-password - senha atual -->
        </p>
        
            <label for="isen">Crie uma senha de acesso </label><br>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="15" placeholder="Mínimo 6 letras" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>


    </form>
    
</body>
</html>
